name: farmtrack
description: "FarmTrack: a voice-guided crop advisory app for farmers of Himachal Pradesh."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  image_picker: ^1.2.4
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/voice/prompts.json
    # voice-assets:begin (managed by tool/sync_voice_assets.py)
    - assets/voice/en/
    - assets/voice/hi/
    # voice-assets:end
    - assets/crops/
