# Alembic configuration. The database URL is NOT stored here: migrations/env.py reads settings.database_url
# (DATABASE_URL env var or the shared .env), or the url a caller sets with config.set_main_option("sqlalchemy.url", ...).
# Usage from backend/:  python -m alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
