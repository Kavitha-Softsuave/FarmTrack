{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Admin sign in</h1>
{% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login" class="panel" autocomplete="off">
  <label for="admin_key">Admin key</label>
  <input id="admin_key" name="admin_key" type="password" required autofocus autocomplete="current-password">
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
