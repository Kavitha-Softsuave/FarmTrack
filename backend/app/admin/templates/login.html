{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block auth %}
<div class="card">
  <div class="brand"><span class="mark" aria-hidden="true">F</span><span><strong>FarmTrack</strong><small>Admin console</small></span></div>
  <h1>Sign in</h1>
  <p class="muted">Staff only. Enter the admin key to continue.</p>
  {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" autocomplete="off">
    <label for="admin_key">Admin key</label>
    <input id="admin_key" name="admin_key" type="password" required autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
