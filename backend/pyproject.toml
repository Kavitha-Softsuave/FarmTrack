[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farmtrack-backend"
version = "0.1.0"
description = "FarmTrack farmer advisory backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.18",      # 0.0.18 fixes CVE-2024-53981 (multipart boundary DoS); 0.0.7 fixed a Content-Type ReDoS
  "pyjwt>=2.10.1",
  "httpx>=0.27",
  "pillow>=11.3",                  # the upload path decodes untrusted images: keep the decoders recent
  "numpy>=1.26",
  "apscheduler>=3.10",
  "jinja2>=3.1.6",
  "tzdata>=2024.1",
  # Pinned from below because they sit under the HTTP stack that faces the internet: Starlette 0.49.1 fixes the FileResponse
  # Range-header DoS (the audio routes use FileResponse); h11 0.16 fixes request smuggling through lenient chunked parsing.
  "starlette>=0.49.1",
  "h11>=0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
ml = ["torch", "torchvision", "timm", "transformers", "safetensors", "huggingface_hub"]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
# FCM push (PUSH_PROVIDER=fcm): the provider signs its Google OAuth JWT (RS256) through PyJWT, which needs `cryptography`.
# It calls the FCM HTTP v1 API with httpx and does not import firebase-admin.
fcm = ["cryptography>=44.0.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# The fixture recorder writes fake placeholder tokens ("FIXTURE-ACCESS-TOKEN") and sends a deliberately invalid one.
"scripts/dump_api_fixtures.py" = ["S105", "S106"]
