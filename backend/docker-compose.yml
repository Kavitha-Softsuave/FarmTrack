# FarmTrack API + PostgreSQL (pgvector). Run from ./backend:
#   docker compose --env-file ../.env up -d --build        (or: make docker-up)
# ../.env must define POSTGRES_PASSWORD (and ADMIN_API_KEY, SECRET_KEY, ENV=prod for anything but a local demo).
# No secret is written in this file. The API gets the whole ../.env; the database only gets its own three variables.
# The API container applies the Alembic migrations before it starts (docker-entrypoint.sh, AUTO_MIGRATE=1 by default).
# With several API replicas set AUTO_MIGRATE=0 in ../.env and run `docker compose run --rm api python -m alembic upgrade head` once per deploy.
name: farmtrack

services:
  api:
    build:
      context: .
      additional_contexts:
        data: ../data
        voice: ../voice
    image: farmtrack-api:dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farmtrack}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ../.env}@db:5432/${POSTGRES_DB:-farmtrack}
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ../.env}
      POSTGRES_DB: ${POSTGRES_DB:-farmtrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    # The database port is deliberately not published. For local inspection add:  ports: ["127.0.0.1:5432:5432"]

volumes:
  pgdata:
  storage:
